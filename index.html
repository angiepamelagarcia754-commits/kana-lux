/* ---------- charts ---------- */
function niceMax(v){ if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function drawCharts(root){
  root.querySelectorAll('.chart[data-series]').forEach(el => {
    let pts = []; try { pts = JSON.parse(el.dataset.series); } catch {}
    if (!pts.length || (pts.length < 2 && el.dataset.h)) { el.innerHTML = `<div class="chart-empty">${esc(el.dataset.empty || 'Sin datos suficientes.')}</div>`; return; }
    const W = Math.max(260, el.clientWidth), H = +(el.dataset.h || 220), unit = el.dataset.unit || '';
    const m = {l:44, r:14, t:14, b:26};
    const xs = pts.map(p => parse(p.x).getTime());
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
    const minY = Math.min(...pts.map(p => p.y)), maxY = niceMax(Math.max(...pts.map(p => p.y)) * 1.08);
    const y0 = unit === 'kg' && minY > maxY * 0.4 ? Math.floor(minY * 0.8 / 10) * 10 : 0;
    const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
    const Y = v => H - m.b - (v - y0) / (maxY - y0) * (H - m.t - m.b);
    const ticks = [0, .25, .5, .75, 1].map(f => y0 + (maxY - y0) * f);
    const P = pts.map((p, i) => [X(xs[i]), Y(p.y)]);
    const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    const area = line + `L${P[P.length - 1][0].toFixed(1)} ${Y(y0)}L${P[0][0].toFixed(1)} ${Y(y0)}Z`;
    const nL = Math.min(pts.length, W < 420 ? 3 : 5);
    const lblIdx = [...new Set(Array.from({length:nL}, (_, i) => Math.round(i * (pts.length - 1) / Math.max(1, nL - 1))))];
    const gid = 'g' + Math.random().toString(36).slice(2, 7);
    const last = P[P.length - 1];
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Gráfico de ${esc(unit)} por fecha">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--body)">${n1(t)}</text>`).join('')}
      ${lblIdx.map(i => `<text x="${P[i][0]}" y="${H - 6}" text-anchor="${i === 0 && lblIdx.length > 1 ? 'start' : i === pts.length - 1 && lblIdx.length > 1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)" font-family="var(--body)">${fmtS(pts[i].x)}</text>`).join('')}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.length <= 40 ? P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('') : ''}
      <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <circle class="dot" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
      <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div>`;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), dot = el.querySelector('.dot');
    const move = ev => {
      const r = svg.getBoundingClientRect(); const mx = ev.clientX - r.left;
      let bi = 0, bd = 1e9; P.forEach((p, i) => { const d = Math.abs(p[0] - mx); if (d < bd) { bd = d; bi = i; } });
      const [px, py] = P[bi];
      xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
      dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('opacity', 1);
      tip.innerHTML = `<b>${n1(pts[bi].y)} ${esc(unit)}</b> · ${fmt(pts[bi].x)}${pts[bi].n ? ` · ${pts[bi].n} vacas` : ''}`;
      tip.style.left = Math.min(Math.max(px, 80), W - 80) + 'px'; tip.style.top = py + 'px'; tip.style.opacity = 1;
    };
    const leave = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
  });
}

let DLG = null;
function openForm(cfg){
  DLG = cfg;
  const f = cfg.fields.map(fl => {
    if (fl.row) return `<div class="frow">${fl.row.map(fieldHtml).join('')}</div>`;

  }).join('');

function fieldHtml(fl){
  const id = 'f-' + fl.id, v = fl.value ?? '';
  let inp;
  if (fl.type === 'select') inp = `<select id="${id}" name="${fl.id}">${fl.options.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (fl.type === 'textarea') inp = `<textarea id="${id}" name="${fl.id}">${esc(v)}</textarea>`;
  else if (fl.type === 'checks') inp = `<div class="checks" data-checks="${fl.id}">${fl.all ? `<label class="chk chk-all"><input type="checkbox" data-all="${fl.id}"> <b>Marcar todos</b></label>` : ''}${fl.options.map(([k, l]) => `<label class="chk"><input type="checkbox" name="${fl.id}" value="${esc(k)}" ${(fl.value || []).includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>`;
  else inp = `<input id="${id}" name="${fl.id}" type="${fl.type === 'number' ? 'text' : fl.type || 'text'}" value="${esc(fl.type === 'number' ? cm(v) : v)}" ${fl.type === 'number' ? `inputmode="decimal" data-num="1"` : ''} ${fl.max ? `max="${fl.max}"` : ''} ${fl.placeholder ? `placeholder="${esc(fl.placeholder)}"` : ''} autocomplete="off">`;
  return `<div class="fld" data-fld="${fl.id}"><label for="${id}">${esc(fl.label)}${fl.required ? '' : ' <span class="sub">(opcional)</span>'}</label>${inp}${fl.hint ? `<div class="h">${esc(fl.hint)}</div>` : ''}</div>`;
}
function formVals(){ const o = {}; new FormData($('#dlgform')).forEach((v, k) => o[k] = typeof v === 'string' ? v.trim() : v); $('#dlgform').querySelectorAll('[data-num]').forEach(e => { if (o[e.name] != null) o[e.name] = dot(o[e.name]); }); $('#dlgform').querySelectorAll('[data-checks]').forEach(e => { o[e.dataset.checks] = [...e.querySelectorAll('input[name]:checked')].map(x => x.value); }); return o; }
function closeForm(){ $('#dlg').innerHTML = ''; DLG = null; VF = null; }
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'dlgform') return;
  ev.preventDefault();

  const flat = DLG.fields.flatMap(f => f.row || [f]);
  const miss = flat.find(f => f.required && !vals[f.id]);
  if (miss) { $('#dlgerr').textContent = `Falta: ${miss.label}.`; return; }

function animalForm(cat, a){
  const isNew = !a; a = a || {cat, activo:true};
  const T = CATS[cat].label;
  const fields = [];
  if (cat === 'lote') {
    fields.push({id:'nombre', label:'Nombre del lote', required:true, value:a.nombre, placeholder:'Ej. Camada C-12 o Engorde 3'});
    fields.push({row:[{id:'cantidad', label:'Cabezas', type:'number', step:1, required:true, value:a.cantidad}, {id:'nacimiento', label:'Fecha de nacimiento', type:'date', required:true, value:a.nacimiento, max:today()}]});
    fields.push({id:'madre', label:'Madre (cerda)', value:a.madre});
  } else {
    fields.push({row:[{id:'arete', label:'Arete / número', required:true, value:a.arete}, {id:'nombre', label:'Nombre', value:a.nombre}]});
    fields.push({row:[{id:'nacimiento', label:'Fecha de nacimiento', type:'date', required: cat === 'ternero', value:a.nacimiento, max:today(), hint:''},
      cat === 'ternero' ? {id:'sexo', label:'Sexo', type:'select', required:true, value:a.sexo || 'hembra', options:[['hembra','Hembra'],['macho','Macho']]} : {id:'raza', label:'Raza', value:a.raza}]});
    if (cat === 'ternero') fields.push({row:[{id:'madre', label:'Madre', value:a.madre}, {id:'raza', label:'Raza', value:a.raza}]});
    else fields.push({id:'madre', label:'Madre', value:a.madre});
    if (cat === 'vaca') fields.push({id:'concentrado', label:'Concentrado (kg por día)', type:'number', step:0.1, value:a.concentrado, hint:'Guía: 1 kg por cada 3 litros de leche. También se cambia en “Concentrado”.'});
  }
  fields.push({id:'registro', label:'Fecha de registro', type:'date', required:true, value: inicio(a) && !isNew ? inicio(a) : today(), max:today(), hint:'El plan de vacunas empieza a contar desde esta fecha.'});
  fields.push({id:'notas', label:'Notas', type:'textarea', value:a.notas});
  if (!isNew) fields.push({id:'activo', label:'Estado', type:'select', required:true, value: a.activo === false ? '0' : '1', options:[['1','Activo'],['0','De baja (vendido, muerto, descartado)']]});
  openForm({
    title: isNew ? `Nuevo ${cat === 'lote' ? 'lote' : T.toLowerCase()}` : `Editar ${cat === 'lote' ? 'lote' : T.toLowerCase()}`,
    fields, submit: isNew ? 'Agregar' : 'Guardar',
    toast: isNew ? `${T} agregado` : 'Cambios guardados',
    validate: v => {
      if (cat !== 'lote') { const dup = [...S.animales.values()].find(x => x.cat === cat && x.id !== a.id && x.arete && x.arete.toLowerCase() === v.arete.toLowerCase() && x.activo !== false); if (dup) return `Ya existe un${cat === 'cerda' || cat === 'vaca' ? 'a' : ''} ${T.toLowerCase()} con el arete ${v.arete}.`; }
      if (v.nacimiento && v.nacimiento > today()) return 'La fecha de nacimiento no puede ser futura.';
      if (v.nacimiento && v.registro && v.registro < v.nacimiento) return 'La fecha de registro no puede ser antes del nacimiento.';
    },
    onSubmit: async v => {
      const na = {...a, id: a.id || uid(), cat, nombre:v.nombre || '', notas:v.notas || '', madre:v.madre || ''};
      na.registro = v.registro;
      if (cat === 'lote') { na.cantidad = +v.cantidad || 0; na.nacimiento = v.nacimiento; }
      else { na.arete = v.arete; na.nacimiento = v.nacimiento || ''; na.raza = v.raza || ''; if (cat === 'ternero') na.sexo = v.sexo; if (cat === 'vaca') { if (v.concentrado === '' || v.concentrado == null) delete na.concentrado; else na.concentrado = Math.round(+v.concentrado * 100) / 100; S.concDraft = null; } }
      if (!isNew) na.activo = v.activo !== '0'; else { na.activo = true; na.creado = new Date().toISOString(); }
      const ok = await saveAnimal(na);
      if (ok && isNew) { S.sheet = na.id; scheduleRender(); }

    },

  });
}

function planForm(id, area){

  const fields = [{id:'nombre', label:'Nombre', required:true, value:cur.nombre}];

  if (area === 'terneros') fields.push({id:'sexo', label:'Sexo', type:'select', required:true, value:cur.sexo || 'todos', options:[['todos','Todos'],['hembra','Solo hembras']]});
  fields.push({row:[{id:'edadDias', label:'1ª aplicación (días desde el registro)', type:'number', step:1, value:cur.edadDias, hint:'0 = el mismo día del registro'},
    ...(area === 'cerdos' ? [{id:'offsetDias', label:'Días respecto al parto', type:'number', step:1, min:-114, value:cur.offsetDias, hint:'Negativo = antes del parto'}] : [])]});
  fields.push({row:[{id:'refuerzoDias', label:'Refuerzo (días después)', type:'number', step:1, value:cur.refuerzoDias}, {id:'repetirDias', label:'Repetir cada (días)', type:'number', step:1, value:cur.repetirDias}]});
  if (area === 'terneros') fields.push({id:'edadMaxDias', label:'Edad máxima (días de nacido)', type:'number', step:1, value:cur.edadMaxDias});
  fields.push({id:'notas', label:'Notas', type:'textarea', value:cur.notas});
  const hide = (k, h) => { const e = $(`[data-fld="${k}"]`); if (e) e.hidden = h; };
  openForm({
    title: isNew ? `Agregar vacuna · ${AREAS[area].label}` : `Editar vacuna · ${AREAS[area].label}`,
    fields,
    onChange: vals => {
      const parto = vals.base === 'parto';

      if (parto && $('#f-aplicaA')) $('#f-aplicaA').value = 'cerda';
    },
    toast: isNew ? 'Vacuna agregada al esquema' : 'Esquema actualizado',
    onSubmit: vals => {
      const num = k => vals[k] === '' || vals[k] == null ? undefined : +vals[k];
      const nv = {id: cur.id || uid(), especie: AREAS[area].esp, nombre: vals.nombre, aplicaA: area === 'cerdos' ? [vals.aplicaA] : AREAS[area].cats.slice(), base: vals.base || 'nacimiento', notas: vals.notas || ''};
      if (cur.ref) nv.ref = cur.ref;
      if (vals.sexo === 'hembra') nv.sexo = 'hembra';
      if (nv.base === 'parto') nv.offsetDias = num('offsetDias') ?? -14;
      else { nv.edadDias = num('edadDias') ?? 0; for (const k of ['refuerzoDias', 'repetirDias', 'edadMaxDias']) if (num(k)) nv[k] = num(k); }
      const list = planList().slice(); const i = list.findIndex(x => x.id === nv.id);

  });

    case 'msave': {
      const dr = dayDraft(S.milkDate);
      const vacas = new Set(animals('vaca').map(x => x.id));
      const r1 = x => Math.round(+x * 100) / 100;
      const lit = {}, que = {}, lam = {}, lpm = {};
      sumOrdenos(dr);
      for (const [k, val] of Object.entries(dr.litros)) if (vacas.has(k) && +val > 0) lit[k] = r1(val);
      for (const [k, val] of Object.entries(dr.am)) if (vacas.has(k) && +val > 0) lam[k] = r1(val);
      for (const [k, val] of Object.entries(dr.pm)) if (vacas.has(k) && +val > 0) lpm[k] = r1(val);
      for (const [k, val] of Object.entries(dr.queso)) if (vacas.has(k) && +val > 0) que[k] = r1(val);
      const prev = S.leche.get(S.milkDate) || {};
      for (const [k, val] of Object.entries(prev.litros || {})) if (!vacas.has(k)) lit[k] = val;
      for (const [k, val] of Object.entries(prev.queso || {})) if (!vacas.has(k)) que[k] = val;
      for (const [k, val] of Object.entries(prev.litrosAM || {})) if (!vacas.has(k)) lam[k] = val;
      for (const [k, val] of Object.entries(prev.litrosPM || {})) if (!vacas.has(k)) lpm[k] = val;
      const body = {fecha: S.milkDate, litrosAM: lam, litrosPM: lpm, litros: lit, queso: que, rendEsp: +dr.rendEsp || 0};
      if (+dr.quesoDia > 0) body.quesoDia = r1(dr.quesoDia);
      el.disabled = true;
      const ok = await saveLeche(S.milkDate, body);
      if (ok) toast(`Día ${fmtS(S.milkDate)} guardado`);
      el.disabled = false; scheduleRender(); break;

document.addEventListener('change', ev => {
  const t = ev.target; if (!t || !t.dataset) return;
  if (t.dataset.rolechk) { const o = JSON.parse(JSON.stringify(getRoles())), r = o[t.dataset.rolechk]; if (!r) return; r.areas = r.areas || {}; r.areas[t.dataset.area] = t.checked; saveRoles(o); }
  else if (t.dataset.userrol) { const us = S.users.map(x => x.usuario === t.dataset.userrol ? {...x, rol: t.value} : x); saveUsers(us); }
});
function userAddForm(){
  openForm({title: 'Agregar usuario', fields: [
    {id: 'nombre', label: 'Nombre completo', required: true},
    {id: 'usuario', label: 'Usuario', required: true, placeholder: 'Ej. juan'},
    {id: 'pass', label: 'Contraseña', type: 'password', required: true, hint: 'Mínimo 6 caracteres'},
    {id: 'pregunta', label: 'Pregunta de seguridad', required: true, placeholder: 'Ej. ¿Nombre de mi primera mascota?', hint: 'Sirve para recuperar la contraseña si se le olvida'},
    {id: 'resp', label: 'Respuesta', required: true},
    {id: 'rol', label: 'Rol', type: 'select', required: true, value: Object.keys(getRoles())[0], options: Object.keys(getRoles()).map(r => [r, r])}],
    validate: v => userNorm(v.usuario).length < 3 ? 'El usuario debe tener al menos 3 letras.' : userNorm(v.usuario) === ADMIN_USER ? 'Ese usuario no está disponible.' : S.users.some(u => u.usuario === userNorm(v.usuario)) ? 'Ese usuario ya existe.' : v.pass.length < 6 ? 'La contraseña debe tener al menos 6 caracteres.' : !v.pregunta.trim() || !v.resp.trim() ? 'Escriba la pregunta y la respuesta de seguridad.' : null,
    toast: 'Usuario agregado',
    onSubmit: async v => saveUsers([...S.users, await mkUser(v.usuario, v.nombre, v.pass, v.rol, v.pregunta, v.resp)])});
}
function userPassForm(usuario){
  const u = S.users.find(x => x.usuario === usuario); if (!u) return;
  openForm({title: 'Contraseña de ' + u.nombre, fields: [
    {id: 'pass', label: 'Contraseña nueva', type: 'password', required: true, hint: 'Mínimo 6 caracteres'}],
    validate: v => v.pass.length < 6 ? 'La contraseña debe tener al menos 6 caracteres.' : null,
    toast: 'Contraseña cambiada',
    onSubmit: async v => { const nu = await conPass(u, v.pass); return saveUsers(S.users.map(x => x.usuario === usuario ? nu : x)); }});
}
function userDel(usuario){
  const u = S.users.find(x => x.usuario === usuario); if (!u) return;
  confirmDelete(`¿Eliminar al usuario ${u.nombre}? Ya no podrá entrar a la app.`, () => saveUsers(S.users.filter(x => x.usuario !== usuario)));
}
function logout(){ S.sesion = null; try { localStorage.removeItem(SES_KEY); } catch {} S.gateReset = false; S.gateReg = false; S.gateUser = null; renderLicGate(); renderAll(); }

/* ---------- init ---------- */
async function init(){
  renderAll();
  db = window.LocalDB;
  if (!db) { S.offline = true; S.plan = {vacunas: DEFAULT_PLAN}; scheduleRender(); return; }
  const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted')) toast('Se perdió el acceso a los datos. Recargue la página.'); };
  db.collection('animales').onSnapshot(s => { S.animales = new Map(s.docs.map(d => [d.id, {id: d.id, ...d.data()}])); S.ready.a = true; if (!S.concDirty) S.concDraft = null; scheduleRender(); }, onErr);
  db.collection('leche').orderBy('fecha', 'desc').limit(800).onSnapshot(s => { S.leche = new Map(s.docs.map(d => [d.id, d.data()])); S.ready.l = true; scheduleRender(); }, onErr);
  db.collection('ventas').onSnapshot(s => { S.ventas = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, onErr);
  db.collection('clientes').onSnapshot(s => { S.clientes = new Map(s.docs.map(d => [d.id, {id: d.id, ...d.data()}])); scheduleRender(); }, onErr);
  db.collection('gastos').onSnapshot(s => { S.gastos = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, onErr);
  db.collection('ajustes').onSnapshot(s => { S.ajustes = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, onErr);
  db.collection('inventario').onSnapshot(s => { S.inv = new Map(s.docs.map(d => [d.id, {id: d.id, ...d.data()}])); scheduleRender(); }, onErr);
  db.doc('config/alertas').get().then(d => { S.alertasRemote = d.exists ? JSON.stringify(d.data().items || []) : null; }).catch(() => {});
  db.doc('config/licencia').onSnapshot(s => { S.lic = s.exists ? s.data() : null; restaurarSesion(); scheduleRender(); }, e => { S.lic = null; scheduleRender(); });
  db.doc('config/roles').onSnapshot(s => { S.roles = s.exists ? s.data() : null; if (!areaOk(S.area)) S.area = firstArea(); scheduleRender(); }, onErr);
  db.doc('config/usuarios').onSnapshot(s => { S.users = s.exists ? (s.data().lista || []) : []; restaurarSesion(); purgarTitular(); if (!areaOk(S.area)) S.area = firstArea(); scheduleRender(); }, e => { S.users = []; scheduleRender(); });
  db.doc('config/leche').onSnapshot(s => { S.metaGen = s.exists ? s.data() : null; scheduleRender(); }, onErr);
  db.doc('config/respaldo').onSnapshot(s => { S.respaldo = s.exists ? s.data() : null; scheduleRender(); }, onErr);
  db.doc('config/concentrado').onSnapshot(s => { S.conc = s.exists ? s.data() : null; if (!S.concDirty) S.concDraft = null; scheduleRender(); }, onErr);
  db.doc('config/plan').onSnapshot(s => { if (!s.exists) { db.doc('config/plan').set({vacunas: DEFAULT_PLAN}); return; } S.plan = s.data(); S.ready.p = true; scheduleRender(); }, onErr);
}
loadNav();
init();
</script>
<script>
/* ===== Kana Lux · versión APK: avisos y botón atrás ===== */
/* avisos locales a las 6:00 */
let _avT = null;
async function programarAvisos(){
  const cap = window.Capacitor, LN = cap && cap.Plugins && cap.Plugins.LocalNotifications;
  if (!LN || !(cap.isNativePlatform && cap.isNativePlatform())) return;
  try {
    const perm = await LN.checkPermissions(); if (perm.display !== 'granted') return;
    const hoy = today(), now = new Date(), items = alertasFuturas();
    const atras = items.filter(x => x.fecha < hoy).length, byDay = {};
    for (const x of items) if (x.fecha >= hoy) (byDay[x.fecha] ||= []).push(x);
    const notifs = []; let id = 1000;
    for (let i = 0; i < 30; i++) {
      const f = addDays(hoy, i), at = parse(f); at.setHours(6, 0, 0, 0);
      if (at <= now) continue;
      const lst = byDay[f] || [], atr = i < 7 ? atras : 0;
      if (!lst.length && !atr) continue;
      const partes = [];
      lst.slice(0, 3).forEach(x => partes.push(`${x.texto.replace(/^Vacuna: /, '')}${x.animal ? ' (' + x.animal + ')' : ''}`));
      if (lst.length > 3) partes.push(`y ${lst.length - 3} más`);
      if (atr) partes.push(`${atr} pendiente${atr > 1 ? 's' : ''} atrasado${atr > 1 ? 's' : ''}`);
      notifs.push({id: id++, title: lst.length ? `Kana Lux · ${lst.length} para hoy` : 'Kana Lux · tiene pendientes', body: partes.join(' · ').slice(0, 300), schedule: {at, allowWhileIdle: true}});
    }
    if (hayDatosFinca()) { const u = ultimaCopia(); for (let k = 0; k < 4; k++) {
      const f = u ? addDays(u, 7 * (k + 1)) : addDays(hoy, k * 7 + 1), at = parse(f); at.setHours(8, 0, 0, 0);
      if (at > now) notifs.push({id: 900 + k, title: 'Kana Lux · copia de seguridad', body: 'Ya pasaron 7 días. Haga su copia de seguridad para no perder sus datos.', schedule: {at, allowWhileIdle: true}}); } }
    const pend = await LN.getPending();
    if (pend.notifications && pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id: n.id}))});
    if (notifs.length) await LN.schedule({notifications: notifs});
  } catch (e) {}
}
const _syncAlertasWeb = syncAlertas;
syncAlertas = function(){ _syncAlertasWeb(); clearTimeout(_avT); _avT = setTimeout(programarAvisos, 5000); };

/* arranque en el celular: permisos de avisos y botón atrás */
(async () => {
  const cap = window.Capacitor; if (!(cap && cap.isNativePlatform && cap.isNativePlatform())) return;
  const P = cap.Plugins;
  try { const LN = P.LocalNotifications; const p = await LN.checkPermissions(); if (p.display === 'prompt' || p.display === 'prompt-with-rationale') await LN.requestPermissions(); programarAvisos(); } catch {}
  try { P.App.addListener('backButton', () => {
    if (document.querySelector('#dlg .dlg-scrim')) { closeForm(); return; }
    if (S.sheet) { S.sheet = null; renderSheet(); return; }
    const sh = document.getElementById('shell'); if (sh && sh.classList.contains('menu-open')) { sh.classList.remove('menu-open'); return; }
    P.App.minimizeApp();
  }); } catch {}
})();
scheduleRender();

</script>
