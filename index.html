<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Kana Lux</title>
<style>
/* Tema al estilo Kana Gold: negro con texto blanco y acentos dorados; modo claro opcional (botón en la barra lateral). */
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --surface:#161616; --surface-2:#1e1e1e; --ink:#ffffff; --ink-2:#b8b8b8; --muted:#8c8c8c; --line:#333333;
  --accent:#e8b923; --accent-ink:#151200; --accent-soft:#3a2f08;
  --cow:#e8b923; --cow-soft:#3a2f08; --pig:#ff8fab; --pig-soft:#3a1522;
  --late:#ff6b5e; --late-bg:#3a1512; --soon:#e8b923; --soon-bg:#3a2f08; --ok:#6fcf6f; --ok-bg:#1c331c; --idle:#b8b8b8; --idle-bg:#262626;
  --shadow:0 1px 3px rgba(0,0,0,.12);
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:18px;
}
:root[data-skin="light"]{
  color-scheme:light;
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f4f2ec; --ink:#141413; --ink-2:#6b6b68; --muted:#8a8984; --line:#e3e0d8;
  --accent:#c9962a; --accent-ink:#1d1400; --accent-soft:#f6e9c9;
  --cow:#9a6f12; --cow-soft:#f6e9c9; --pig:#b8456a; --pig-soft:#fbe3ea;
  --late:#c0392b; --late-bg:#fbe2df; --soon:#9a6f12; --soon-bg:#f6e9c9; --ok:#2f9e44; --ok-bg:#e3f6e3; --idle:#6b6b68; --idle-bg:#efede7;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
/* ---- Estructura Kana Gold: barra lateral + área de contenido ---- */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.sidebar-brand svg,.sidebar-brand img{width:36px;height:36px;flex:none;border-radius:9px}
.sidebar-brand b{font-weight:700;font-size:17px;display:block;line-height:1.1}
.sidebar-brand small{color:var(--muted);font-size:12px}
.stagebar{display:flex;flex-direction:column;gap:3px;margin:0 0 14px}
.stagebtn,.subtab{border:none;background:transparent;color:var(--ink-2);text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%}
.subtab{padding:11px 14px;font-size:14px}
.stagebtn:hover,.subtab:hover{background:var(--surface-2)}
.stagebtn.active,.subtab.active{background:var(--accent-soft);color:var(--accent)}
.stagebtn .ico,.subtab .ico{width:22px;text-align:center;flex:none}
.stagebtn .lbl-t,.subtab .lbl-t{flex:1;min-width:0}
.sb-badge{background:var(--late);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}
.subtabs{display:flex;flex-direction:column;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
.sb-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:4px 14px 6px}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.theme-toggle{position:relative;width:44px;height:24px;flex-shrink:0;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0}
.theme-toggle .thumb{position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;transition:left .18s ease}
.theme-toggle.light .thumb{left:21px}
.content-area{flex-grow:1;min-width:0;padding:32px 40px 48px}
.page-head{margin-bottom:20px}
.page-head .eyebrow2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.page-head h1{font-size:26px;font-weight:700;margin-top:2px}
.mtop{display:none}
.sb-scrim{display:none}
@media (max-width:860px){
  .shell{display:block}
  .mtop{display:flex;align-items:center;justify-content:flex-start;gap:12px;position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .mtop .sidebar-brand{padding:0}
  .menu-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer;color:var(--ink)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.4);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .shell.menu-open .sidebar{transform:none}
  .shell.menu-open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
  .content-area{padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:26px;font-weight:700;line-height:1}
.brand small{display:block;font-family:var(--display);font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.today{font-family:var(--display);color:var(--ink-2);font-size:15px;text-align:right}
.brand h1,.brand small{white-space:nowrap}
@media (max-width:480px){.today{font-size:13px;max-width:110px}}

/* nav */
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.nav button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:7px}
.nav button svg{width:18px;height:18px}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav button:hover{color:var(--ink)}
.nav .badge{background:var(--late);color:var(--surface);font-size:11px;border-radius:9px;padding:0 6px;line-height:17px;font-family:var(--body);font-weight:700}
@media (max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border:0;border-top:1px solid var(--line);background:var(--surface);justify-content:space-around;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:column;gap:2px;font-size:12px;padding:6px 4px;border-bottom:0;border-top:3px solid transparent;margin:0;flex:1;position:relative}
  .nav button[aria-current="page"]{border-top-color:var(--accent)}
  .nav button svg{width:22px;height:22px}
  .nav .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;line-height:15px;padding:0 5px}
}

.area-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.area-t{font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px}
.area-ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px}
.area-ic svg{width:22px;height:22px}
.area-terneros,.area-vacas{background:var(--cow-soft);color:var(--cow)}
.area-cerdos{background:var(--pig-soft);color:var(--pig)}
.subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.subnav button:hover{border-color:var(--ink-2)}
.subnav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subnav .badge{background:var(--late);color:var(--surface);font-size:11px;border-radius:9px;padding:0 6px;line-height:17px}
/* general */
.section{display:grid;gap:14px;margin-bottom:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:21px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:transparent;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.licgate{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
.licbox{width:min(560px,100%);display:grid;gap:14px}
.licbox h1{margin:0;font-size:24px}.licbox label{display:grid;gap:6px;font-weight:700;font-size:13.5px}
.licbox input[type=text],.licbox input[type=password],.licbox select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600}
.licterms{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink-2);background:var(--surface)}
.licterms p{margin:0 0 8px}.licerr{color:var(--late);font-weight:700;min-height:18px;font-size:13.5px}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:759px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.kpi .val{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.kpi .val small{font-size:16px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .hint{font-size:12.5px;color:var(--muted)}
.kpi.alert .val{color:var(--late)}

.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-atrasada{color:var(--late);background:var(--late-bg)}
.st-proxima{color:var(--soon);background:var(--soon-bg)}
.st-aldia{color:var(--ok);background:var(--ok-bg)}
.st-pendiente,.st-sinregistro,.st-fuera{color:var(--idle);background:var(--idle-bg)}
.sp{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.sp-bovino{color:var(--cow);background:var(--cow-soft)}
.sp-porcino{color:var(--pig);background:var(--pig-soft)}

/* lists */
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .d{color:var(--muted);font-size:13.5px}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.tag{font-family:var(--display);font-weight:700;font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 7px;min-width:44px;text-align:center}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--display);font-size:18px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.up{color:var(--ok)} .down{color:var(--late)}

/* milk entry */
.milk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.datebar{display:flex;align-items:center;gap:6px}
.datebar input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.milk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.milk-cell{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 10px;background:var(--surface-2)}
.milk-cell label{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.milk-cell label span{color:var(--muted);font-weight:400}
.milk-cell .kgc{width:58px;text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.milk-cell input{width:84px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.milk-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.total{font-family:var(--display);font-weight:700;font-size:22px}
.total small{font-size:14px;color:var(--muted);font-weight:500}

.day-params{display:flex;flex-wrap:wrap;gap:10px 22px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.day-params label{display:flex;align-items:center;gap:8px}
.inp-pre{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:400}
.day-tbl input,.day-params input{width:84px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2);font-variant-numeric:tabular-nums;color:var(--ink)}
.conc-precio{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;padding:16px}
.conc-precio label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.conc-precio input{width:140px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface-2);font-size:17px;font-family:var(--display);font-weight:700;color:var(--ink)}
.conc-kg{display:flex;flex-direction:column;gap:2px}.conc-kg b{font-size:22px;font-family:var(--display);color:var(--accent)}
.spark{display:block}.tend-st{font-weight:700}.tend-why{font-size:12px;color:var(--muted);margin-top:2px;white-space:normal;max-width:320px}
.rep-sec h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}.rep-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}.rep-kpis>div{background:var(--surface);padding:12px 16px}.rep-kpis dt{font-size:12px;color:var(--muted);font-weight:600}.rep-kpis dd{margin:4px 0 0;font-size:18px;font-weight:700;font-family:var(--display)}
.conc-sec{min-width:0}.conc-sec>.card{max-width:100%;overflow:hidden}.conc-sec .tbl-wrap{overflow-x:auto}
.conc-tbl td .sub{display:block;font-size:12px}
.conc-tbl td.sug{color:var(--muted)}
.conc-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.day-tbl input.wide{width:150px;text-align:left}
.day-tbl td{padding:6px 12px}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);font-family:var(--display);font-size:15px}
.balance{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink-2)}
.balance b{color:var(--ink)}
.warn{color:var(--soon)}
.sales{border-color:var(--accent);border-left-width:4px;overflow:hidden}
.sale-actions{display:flex;gap:10px;flex-wrap:wrap}
.sale-tot{font-size:14px;color:var(--ink-2)}
.sale-tot b{font-family:var(--display);font-size:20px;color:var(--ink);margin-left:4px}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.save-big{padding:11px 34px;font-size:16px}
.period{display:grid;gap:10px}
.period .seg{justify-self:start}
.period-nav{display:flex;align-items:center;gap:10px}
.period-nav h2{font-size:21px;font-weight:700;flex:1;min-width:0}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
tr.muted td{color:var(--muted)}
.cheese-body{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;padding:14px 16px}
.cheese-in{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.cheese-in input{width:110px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-2);font-size:18px;font-family:var(--display);font-weight:700;color:var(--ink)}
.cheese-facts{display:flex;flex-wrap:wrap;gap:12px 28px;margin:0}
.cheese-facts .hl dd{color:var(--accent)}
.cheese-facts div{display:grid}
.cheese-facts dt{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--muted)}
.cheese-facts dd{margin:0;font-family:var(--display);font-weight:700;font-size:20px}
.sale-actions .seg{margin-right:auto}
.bodega-hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 20px;border-color:var(--accent);border-left-width:4px}
.bodega-hero > div{display:grid;gap:2px}
.bodega-hero .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.bodega-hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05}
.bodega-hero .big small{font-size:20px;color:var(--ink-2)}
.bod-val{text-align:right}

<script>
/* ===== Kana Lux · versión APK: base de datos en el celular y archivos ===== */
(function(){
  const PFX = 'gab:';
  const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  const load = coll => { try { return JSON.parse(localStorage.getItem(PFX + coll) || '{}'); } catch { return {}; } };
  const store = (coll, obj) => { try { localStorage.setItem(PFX + coll, JSON.stringify(obj)); } catch (e) { const er = new Error('No hay espacio en el celular para guardar.'); er.code = 'quota'; throw er; } };
  const subs = [];
  const snapDoc = (coll, id) => { const d = load(coll)[id]; return {id, exists: d !== undefined, data: () => clone(d)}; };
  const snapColl = (coll, opts) => {
    let docs = Object.entries(load(coll)).map(([id, d]) => ({id, data: () => clone(d), _d: d}));
    if (opts.orderBy) { const [f, dir] = opts.orderBy; docs.sort((a, b) => { const x = a._d[f], y = b._d[f]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); }); }
    if (opts.limit) docs = docs.slice(0, opts.limit);
    return {docs, size: docs.length, empty: !docs.length};
  };
  const notify = coll => { for (const s of subs) if (s.coll === coll) setTimeout(() => s.cb(s.id ? snapDoc(coll, s.id) : snapColl(coll, s.opts)), 0); };
  const sub = s => { subs.push(s); setTimeout(() => s.cb(s.id ? snapDoc(s.coll, s.id) : snapColl(s.coll, s.opts)), 0); return () => { const i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; };
  const query = (coll, opts) => ({
    orderBy: (f, dir) => query(coll, {...opts, orderBy: [f, dir || 'asc']}),
    limit: n => query(coll, {...opts, limit: n}),
    get: async () => snapColl(coll, opts),
    onSnapshot: cb => sub({coll, opts, cb})
  });
  window.LocalDB = {
    collection: c => query(c, {}),
    doc: path => { const i = path.lastIndexOf('/'), coll = path.slice(0, i), id = path.slice(i + 1); return {
      get: async () => snapDoc(coll, id),
      set: async data => { const o = load(coll); o[id] = clone(data); store(coll, o); notify(coll); },
      update: async data => { const o = load(coll); o[id] = {...(o[id] || {}), ...clone(data)}; store(coll, o); notify(coll); },
      delete: async () => { const o = load(coll); delete o[id]; store(coll, o); notify(coll); },
      onSnapshot: cb => sub({coll, id, cb})
    }; }
  };
  window.GAB_COLLS = ['animales', 'leche', 'ventas', 'clientes', 'gastos', 'ajustes', 'inventario', 'config'];
  window.GAB_LOAD = load; window.GAB_STORE = store;

  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  window.NativeDL = { save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const cap = window.Capacitor, P = cap && cap.Plugins;
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && P && P.Filesystem && P.Share) {
      const safe = String(filename).replace(/[\/\\:*?"<>|]/g, '_');
      const r = await P.Filesystem.writeFile({path: safe, data: await toB64(blob), directory: 'CACHE'});
      try { await P.Share.share({title: filename, files: [r.uri], dialogTitle: 'Guardar o enviar'}); }
      catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) { const er = new Error('cancelado'); er.code = 'declined'; throw er; } throw e; }
      return {status: 'saved'};
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return {status: 'saved'};
  }};
})();

function schedule(a){

    const apps = (a.vacunas || []).filter(x => x.vacunaId === v.id || (v.ref && x.vacunaId === v.ref)).sort(byFecha);
    const last = apps[apps.length - 1];
    if (v.base === 'parto') {
      const g = gestacion(a);
      if (!g) continue;
      const due = addDays(partoEsp(a, g), +v.offsetDias || 0);
      const done = apps.some(x => x.fecha >= g.fecha);
      out.push(done ? {v, state:'aldia', due:null, dosis:'', last: last.fecha} : {v, state: stateFor(due), due, dosis:'Gestación actual'});
      continue;
    }
    if (!apps.length) {
      const ini = inicio(a);
      if (!ini) { out.push({v, state:'sinregistro', due:null, dosis:'1ª dosis'}); continue; }
      const due = addDays(ini, +v.edadDias || 0);
      if (v.edadMaxDias && diff(a.nacimiento, today()) > +v.edadMaxDias) { out.push({v, state:'fuera', due:null, dosis:''}); continue; }
      out.push({v, state: stateFor(due), due, dosis:'1ª dosis'});
    } else if (+v.refuerzoDias > 0 && apps.length < 2) {
      const due = addDays(apps[0].fecha, +v.refuerzoDias);
      out.push({v, state: stateFor(due), due, dosis:'Refuerzo', last: last.fecha});
    } else if (+v.repetirDias > 0) {
      const due = addDays(last.fecha, +v.repetirDias);
      const st = stateFor(due);
      out.push({v, state: st === 'pendiente' ? 'aldia' : st, due, dosis:'Revacunación', last: last.fecha});
    } else {
      out.push({v, state:'aldia', due:null, dosis:'', last: last.fecha});
    }
  }

const r2 = x => Math.round((+x || 0) * 1000) / 1000;

/* monthly-bucket collections: ventas/{YYYY-MM}, gastos/{YYYY-MM}, ajustes/{YYYY-MM} = {mes, items:[]} */
const monthRaw = (map, ym) => ((map.get(ym) || {}).items || []);
function saveMonth(coll, map, ym, items){
  return write(
    () => items.length ? db.doc(coll + '/' + ym).set({mes: ym, items}) : db.doc(coll + '/' + ym).delete(),
    () => items.length ? map.set(ym, {mes: ym, items}) : map.delete(ym)
  );
}
async function upsertMonthItem(coll, map, item, oldYm){
  const ym = item.fecha.slice(0, 7);
  if (oldYm && oldYm !== ym) { const ok = await saveMonth(coll, map, oldYm, monthRaw(map, oldYm).filter(x => x.id !== item.id)); if (!ok) return false; }
  return saveMonth(coll, map, ym, [...monthRaw(map, ym).filter(x => x.id !== item.id), item]);
}
const deleteMonthItem = (coll, map, item) => saveMonth(coll, map, item.fecha.slice(0, 7), monthRaw(map, item.fecha.slice(0, 7)).filter(x => x.id !== item.id));

/* ventas */
function normVenta(v){
  const src = Array.isArray(v.lineas) && v.lineas.length ? v.lineas : [{tipo: v.tipo || 'queso', cantidad: v.cantidad, precio: v.precio}];
  const lineas = src.map(l => ({...l, tipo: l.tipo || 'otro', c: +l.cantidad || 0, P: +l.precio || 0, tot: (+l.cantidad || 0) * (+l.precio || 0)}));
  const total = lineas.reduce((s, l) => s + l.tot, 0), pago = v.pago || 'efectivo';
  const abonos = (v.abonos || []).map(a => ({...a, monto: +a.monto || 0})).sort(byFecha);
  const pagado = pago === 'credito' ? Math.min(total, abonos.reduce((s, a) => s + a.monto, 0)) : total;
  return {...v, lineas, total, tot: total, pago, abonos, pagado, saldo: Math.max(0, total - pagado)};
}
const ventasDe = ym => monthRaw(S.ventas, ym).map(normVenta).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.creado || '').localeCompare(a.creado || ''));

  return {id: v.id, fecha: v.fecha, cliente: v.cliente || '', lineas: v.lineas.map(l => { const o = {tipo: l.tipo, cantidad: r2(l.cantidad ?? l.c), precio: +(l.precio ?? l.P) || 0}; if (l.desc) o.desc = l.desc; if (l.animalId) o.animalId = l.animalId; return o; }),
    pago: v.pago || 'efectivo', abonos: (v.abonos || []).map(a => ({id: a.id, fecha: a.fecha, monto: +a.monto || 0, forma: a.forma || 'efectivo'})), notas: v.notas || '', creado: v.creado || new Date().toISOString()};
}
const saveVenta = (v, oldYm) => upsertMonthItem('ventas', S.ventas, cleanVenta(v), oldYm);
const deleteVenta = v => deleteMonthItem('ventas', S.ventas, v);
function facturaNumeros(){

const detalleVenta = v => v.lineas.map(l => l.tipo === 'animal' || l.tipo === 'otro' ? (l.desc || PROD[l.tipo].l) + (l.c !== 1 ? ` ×${n1(l.c)}` : '') : `${PROD[l.tipo].l} ${l.tipo === 'queso' ? nk(l.c) : n1(l.c)} ${PROD[l.tipo].u}`).join(' · ');

/* clientes */
const clientesList = () => [...S.clientes.values()].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));

function lastPrecio(tipo, cliente){

/* gastos y ajustes */
const gastosDe = ym => monthRaw(S.gastos, ym).map(g => ({...g, monto: +g.monto || 0}));
const allGastos = () => [...S.gastos.keys()].flatMap(gastosDe);
const ajustesDe = ym => monthRaw(S.ajustes, ym).map(a => ({...a, kg: +a.kg || 0}));

function quesoBodega(){
  const prod = [...S.leche.values()].reduce((s, d) => s + (+d.quesoDia || 0), 0);
  const vend = allVentas().reduce((s, v) => s + v.lineas.filter(l => l.tipo === 'queso').reduce((a, l) => a + l.c, 0), 0);
  return prod - vend - allAjustes().reduce((s, a) => s + a.kg, 0);
}

/* numbers for a date range */
function finCalc(from, to){
  const inR = f => f >= from && f <= to;
  const ventas = allVentas().filter(v => inR(v.fecha));
  const ing = {queso:0, leche:0, animal:0, otro:0}, cant = {queso:0, leche:0, animal:0, otro:0}, nv = {queso:0, leche:0, animal:0, otro:0};
  for (const v of ventas) for (const l of v.lineas) { ing[l.tipo] += l.tot; cant[l.tipo] += l.c; nv[l.tipo]++; }
  const vendido = ventas.reduce((s, v) => s + v.total, 0);
  const cobros = {efectivo:0, sinpe:0, transferencia:0};
  for (const v of allVentas()) {
    if (v.pago !== 'credito') { if (inR(v.fecha)) cobros[v.pago] = (cobros[v.pago] || 0) + v.total; }
    else for (const a of v.abonos) if (inR(a.fecha)) cobros[a.forma || 'efectivo'] = (cobros[a.forma || 'efectivo'] || 0) + a.monto;
  }
  const cobrado = Object.values(cobros).reduce((s, x) => s + x, 0);
  const pendiente = ventas.reduce((s, v) => s + v.saldo, 0);
  const gastos = allGastos().filter(g => inR(g.fecha));
  const gCat = {}; for (const g of gastos) gCat[g.categoria || 'otros'] = (gCat[g.categoria || 'otros'] || 0) + g.monto;
  const gTotal = gastos.reduce((s, g) => s + g.monto, 0);
  return {ventas, ing, cant, nv, vendido, cobros, cobrado, pendiente, gastos, gCat, gTotal, ganancia: vendido - gTotal};
}

const vacasOrden = () => animals('vaca').sort((a, b) => (a.arete || '').localeCompare(b.arete || '', 'es', {numeric:true}));
const n2 = v => (v == null || isNaN(v)) ? '—' : v.toLocaleString('es-CR', {minimumFractionDigits:2, maximumFractionDigits:2});
const col = v => (v == null || isNaN(v)) ? '—' : (Math.round(v) < 0 ? '-' : '') + '₡' + Math.abs(Math.round(v)).toLocaleString('es-CR');
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function dayDefaults(){
  const docs = [...S.leche.values()].sort(byFecha).reverse();
  const lastP = key => { for (const d of docs) { const v = (d[key] || []).find(x => +x.precio > 0); if (v) return v.precio; } return ''; };
  return {precioKilo: lastP('ventasQueso') || docs.find(d => +d.precioKilo > 0)?.precioKilo || 3200, rendEsp: docs.find(d => +d.rendEsp > 0)?.rendEsp ?? 4.8, precioLitro: lastP('ventas')};
}
function dayDraft(f){
  if (S.milkDraft[f]) return S.milkDraft[f];
  const d = S.leche.get(f), def = dayDefaults();
  const str = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [k, String(v)]));
  const am = str(d?.litrosAM), pm = str(d?.litrosPM);
  // registros viejos sin ordeños: el total queda en el ordeño de la mañana
  for (const [k, v] of Object.entries(d?.litros || {})) if (am[k] == null && pm[k] == null) am[k] = String(v);
  const dr = {am, pm, litros: {}, queso: str(d?.queso), quesoDia: d?.quesoDia ? String(d.quesoDia) : '', rendEsp: String(d?.rendEsp ?? def.rendEsp)};
  sumOrdenos(dr);
  return S.milkDraft[f] = dr;
}
function sumOrdenos(dr){
  dr.litros = {};
  for (const k of new Set([...Object.keys(dr.am), ...Object.keys(dr.pm)])) { const t = (+dr.am[k] || 0) + (+dr.pm[k] || 0); if (t > 0) dr.litros[k] = String(Math.round(t * 100) / 100); }
}
/* one day's numbers, from a draft (cant) or a saved doc (litros/kilos) */
function dayCalc(d, ids){
  const re = +d.rendEsp || 0;
  ids = ids || [...new Set([...Object.keys(d.litros || {}), ...Object.keys(d.queso || {})])];
  const rows = ids.map(id => {
    const L = +(d.litros || {})[id] || 0, K = +(d.queso || {})[id] || 0;
    const esp = K > 0 && L > 0 && re ? L / re : null;
    const am = +(d.am || d.litrosAM || {})[id] || 0, pm = +(d.pm || d.litrosPM || {})[id] || 0;
    return {id, L, K, am, pm, rend: L > 0 && K > 0 ? L / K : null, esp, dif: esp == null ? null : K - esp};
  });
  const T = rows.reduce((t, r) => { t.L += r.L; t.K += r.K; t.am += r.am; t.pm += r.pm; if (r.K > 0) t.Lq += r.L; if (r.esp != null) t.esp += r.esp; return t; }, {L:0, K:0, Lq:0, esp:0, am:0, pm:0});
  T.rend = T.K > 0 && T.Lq > 0 ? T.Lq / T.K : null; T.dif = T.esp ? T.K - T.esp : null;
  const mk = (arr, key) => (arr || []).map(v => { const c = +(v.cant ?? v[key]) || 0, p = +v.precio || 0; return {...v, c, P: p, tot: c * p}; });
  const ventas = mk(d.ventas, 'litros'), ventasQ = mk(d.ventasQueso, 'kilos');
  T.vL = ventas.reduce((s, v) => s + v.c, 0); T.vT = ventas.reduce((s, v) => s + v.tot, 0);
  T.qK = ventasQ.reduce((s, v) => s + v.c, 0); T.qT = ventasQ.reduce((s, v) => s + v.tot, 0);
  T.resto = T.L - T.Lq - T.vL;
  return {rows, T, ventas, ventasQ, re};
}
const rendCls = (rend, re) => rend == null || !re ? '' : rend <= re ? 'up' : rend <= re * 1.1 ? 'warn' : 'down';
const difTxt = d => d == null ? '—' : (d >= 0 ? '+' : '−') + n1(Math.abs(d)) + ' kg';

      ${vacas.map(v => `<tr><td><b>${esc(v.arete || '')}</b> ${esc(v.nombre || '')}${ubreEstado(v) ? `<div>${ubreChip(v)}</div>` : ''}</td>

        <td class="r"><input class="day-in" data-pm="${v.id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(cm(dr.pm[v.id]))}" aria-label="Litros de ${esc(v.nombre || v.arete)} en la tarde"></td>

      text(M, 70, 'Reporte mensual · ' + R.mesTxt, {size:20, bold:true, color:'#ffffff'});
      text(PW - M, 42, 'Generado el ' + fmt(today()), {size:9, color:'#bbbbbb', align:'r'});

function alertasFuturas(){

/* ---------- producción por vaca ---------- */
function spark(pts, down){
  if (pts.length < 2) return '<span class="sub">—</span>';
  const W = 120, H = 32, ys = pts.map(p => p.y), mx = Math.max(...ys), mn = Math.min(...ys), r = mx - mn || 1;
  const t0 = parse(pts[0].x), span = Math.max(1, (parse(pts[pts.length - 1].x) - t0) / 864e5);
  const xy = pts.map(p => `${((parse(p.x) - t0) / 864e5 / span * (W - 4) + 2).toFixed(1)},${(H - 3 - (p.y - mn) / r * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${xy}" fill="none" stroke="var(${down ? '--late' : '--accent'})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function tendencia(v){
  const s = cowStats(v.id), g = gestacion(v), ue = ubreEstado(v);
  if (ue && ue.k === 'fuera') return {v, s, k:'ubre', ch:null, es: esperadoVaca(v, s)};
  if (ue && ue.k === 'recup') return {v, s, k:'recup', ch:null, es: esperadoVaca(v, s)};
  if (g && g.secado) return {v, s, k:'seca', ch:null, es: esperadoVaca(v, s)};
  const es = esperadoVaca(v, s);
  if (s.p7 == null || !es) return {v, s, k:'sin', ch:null, es};
  const ch = (s.p7 - es.L) / es.L * 100;
  return {v, s, es, ch, k: ch <= -10 ? 'baja' : ch >= 10 ? 'sube' : 'estable'};
}
function vTendencia(){
  const vacas = vacasOrden();

    </div></section>
  <section class="section conc-sec">${metaBar()}<div class="sec-head"><h2>Cómo va cada vaca</h2><span class="sub" style="white-space:normal">Promedio de los últimos 7 días contra la leche que se espera de cada vaca</span></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Vaca</th><th>Estado</th><th class="r">Últimos 7 días</th><th class="r">Esperado (L/día)</th><th class="r">Diferencia</th><th class="r">Prom. 30 días</th><th>Últimos 30 días</th></tr></thead><tbody>
    ${list.map(x => { const e = vacaEstado(x.v), pts = x.s.pts.filter(p => p.x > addDays(today(), -30));
      const why = x.k === 'baja' ? `Revise: mastitis, celo, cojera, cambio de alimento o agua${(e.k === 'prenada' || e.k === 'servida') ? '. Está preñada: es normal que baje al final de la lactancia' : ''}.` : '';

        <td class="r num">${lk(x.s.p7)}</td><td class="r"><input class="day-in meta-in" data-meta="${x.v.id}" type="text" inputmode="decimal" autocomplete="off" style="width:76px" placeholder="${x.es ? cm(Math.round(x.es.L * 10) / 10) : '0'}" value="${+x.v.metaL > 0 ? esc(cm(x.v.metaL)) : ''}" aria-label="Leche esperada por día de ${esc(x.v.nombre || x.v.arete)}"><div class="sub">${x.es ? (x.es.src === 'meta' ? 'meta propia' : x.es.src === 'general' ? 'promedio general' : x.es.src === 'base' ? 'su promedio normal' : 'semana anterior') : 'sin datos'}</div></td>
        <td class="r num tend-st ${x.ch == null ? '' : x.ch >= 0 ? 'up' : 'down'}">${x.ch == null ? '—' : (x.ch >= 0 ? '+' : '−') + Math.round(Math.abs(x.ch)) + ' %'}</td>

  </section>`;
}

/* ---------- concentrado ---------- */
const CONC_DEF = {precioSaco: 11500, kgSaco: 46};
const CONC_PER = [['dia','Por día',1],['semana','Semana',7],['quincena','Quincena',15],['mes','Mes',30]];
function concDraft(){
  if (S.concDraft) return S.concDraft;
  const c = S.conc || CONC_DEF, rac = {};
  for (const v of animals('vaca')) rac[v.id] = v.concentrado != null ? v.concentrado : '';
  return S.concDraft = {precio: c.precioSaco ?? CONC_DEF.precioSaco, kg: c.kgSaco ?? CONC_DEF.kgSaco, rac};
}
function lecheProm(id){
  for (const n of [7, 30]) { const b = periodCalc(addDays(today(), -(n - 1)), today()).byCow.find(x => x.id === id); if (b && b.dias) return {L: b.L / b.dias, n}; }
  return null;
}
const concSug = L => L == null ? null : Math.round(L / 3 * 2) / 2;
function concCalc(){
  const d = concDraft(), kgS = +dot(d.kg) || 0, pr = +dot(d.precio) || 0, pkg = kgS > 0 ? pr / kgS : 0;
  let tot = 0; const rows = vacasOrden().map(v => { const k = +dot(d.rac[v.id]) || 0; tot += k; return {v, k}; });
  return {pkg, kgS, pr, rows, tot};
}
const concCell = (k, pkg, n) => `<b>${n1(k * n)} kg</b><span class="sub">${col(k * n * pkg)}</span>`;
function vConcentrado(){
  const vacas = vacasOrden();

  const d = concDraft(), C = concCalc();
  return `<section class="section"><div class="card">
      <div class="block-h"><h3>Precio del concentrado</h3></div>

        <label for="c-kgs">Kilos por saco<input id="c-kgs" class="conc-in" type="text" inputmode="decimal" autocomplete="off" value="${esc(cm(d.kg))}"></label>
        <div class="conc-kg"><span class="sub">Precio por kilo</span><b class="num" id="c-pkg">${col(C.pkg)}</b></div>
      </div>
    </div></section>
  <section class="section"><div class="kpis" id="c-kpis">${concKpis(C)}</div></section>
  <section class="section conc-sec"><div class="sec-head"><h2>Ración por vaca</h2><span class="sub" style="white-space:normal">Escriba los kilos que come cada vaca al día</span></div>
    <div class="card">
      <div class="tbl-wrap"><table class="day-tbl conc-tbl"><thead><tr><th>Vaca</th><th class="r">Leche promedio</th><th class="r">Sugerido</th><th class="r">Ración (kg/día)</th><th class="r">Semana</th><th class="r">Quincena</th><th class="r">Mes</th></tr></thead><tbody>
      ${C.rows.map(({v, k}) => { const lp = lecheProm(v.id), sg = concSug(lp && lp.L); return `<tr><td><b>${esc(v.arete || '')}</b> ${esc(v.nombre || '')}</td>
        <td class="r num">${lp ? `${n1(lp.L)} L/día<span class="sub">últimos ${lp.n} días</span>` : '<span class="sub">Sin registros</span>'}</td>
        <td class="r num sug">${sg != null ? `${cm(sg)} kg` : '—'}</td>
        <td class="r"><input class="day-in conc-rac" data-rac="${v.id}" ${sg != null ? `data-sug="${sg}"` : ''} type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(cm(d.rac[v.id]))}" aria-label="Kilos de concentrado al día para ${esc(v.nombre || v.arete)}"></td>
        ${CONC_PER.slice(1).map(([p, , n]) => `<td class="r num" id="c-${p}-${v.id}">${concCell(k, C.pkg, n)}</td>`).join('')}</tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="3">Total de todas las vacas</td><td class="r num" id="c-tot-dia">${n1(C.tot)} kg</td>${CONC_PER.slice(1).map(([p, , n]) => `<td class="r num" id="c-tot-${p}">${concCell(C.tot, C.pkg, n)}</td>`).join('')}</tr></tfoot></table></div>

      <div class="conc-actions"><span class="sub savestate-c"></span><button class="btn" data-act="concsug">Usar lo sugerido en todas</button><button class="btn primary" data-act="concsave">Guardar</button></div>

function concKpis(C){
  return CONC_PER.map(([p, l, n]) => kpi(l === 'Por día' ? 'Consumo por día' : `Consumo por ${l.toLowerCase()}`, col(C.tot * n * C.pkg), `${n1(C.tot * n)} kg${C.kgS > 0 ? ` · ${n1(Math.round(C.tot * n / C.kgS * 10) / 10)} sacos` : ''}`)).join('');
}
function updConc(){

  $('#c-tot-dia').textContent = `${n1(C.tot)} kg`;
  for (const [p, , n] of CONC_PER.slice(1)) $('#c-tot-' + p).innerHTML = concCell(C.tot, C.pkg, n);

async function saveConc(){
  const d = concDraft(), pr = +dot(d.precio), kg = +dot(d.kg);
  if (!(pr > 0) || !(kg > 0)) { toast('Escriba el precio del saco y los kilos que trae.'); return; }
  const cfg = {precioSaco: pr, kgSaco: kg, actualizado: new Date().toISOString()};
  let ok = await write(() => db.doc('config/concentrado').set(cfg), () => { S.conc = cfg; });
  for (const v of animals('vaca')) {
    const raw = d.rac[v.id], val = raw === '' || raw == null ? null : Math.round(+dot(raw) * 100) / 100;
    if (val != null && isNaN(val)) continue;

/* 5. Bodega de queso */
function movimientosQueso(){
  const mov = [];
  for (const d of S.leche.values()) if (+d.quesoDia > 0) mov.push({fecha: d.fecha, tipo: 'entrada', kg: +d.quesoDia, txt: 'Producción del día', creado: '', act: 'goday', v: d.fecha});
  for (const v of allVentas()) { const kg = v.lineas.filter(l => l.tipo === 'queso').reduce((s, l) => s + l.c, 0); if (kg > 0) mov.push({fecha: v.fecha, tipo: 'salida', kg, txt: 'Venta' + (v.cliente ? ' · ' + v.cliente : ''), creado: v.creado || '', act: 'factura', v: v.id}); }
  for (const a of allAjustes()) if (a.kg > 0) mov.push({fecha: a.fecha, tipo: 'ajuste', kg: a.kg, txt: (AJ_L[a.motivo] || 'Salida sin venta') + (a.nota ? ' · ' + a.nota : ''), creado: a.creado || '', act: 'eajuste', v: a.id});
  mov.sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.tipo === 'entrada' ? -1 : b.tipo === 'entrada' ? 1 : 0) || a.creado.localeCompare(b.creado));
  let saldo = 0; for (const m of mov) { saldo += m.tipo === 'entrada' ? m.kg : -m.kg; m.saldo = saldo; }
  return mov;

  else if (t.dataset.vfl) { const [i, f] = t.dataset.vfl.split(':'); const l = VF.lineas[+i]; if (!l) return; l[f] = (f === 'cantidad' || f === 'precio') ? dot(t.value) : t.value; }

async function saveVF(){
  const v = VF, err = m => { $('#vf-err').textContent = m; };
  if (!v.fecha) return err('Falta la fecha.');
  for (const [i, l] of v.lineas.entries()) {
    if (!(+l.cantidad > 0)) return err(`Producto ${i + 1}: escriba la cantidad.`);
    if (!(+l.precio > 0)) return err(`Producto ${i + 1}: escriba el precio.`);
    if (l.tipo === 'otro' && !l.desc.trim()) return err(`Producto ${i + 1}: escriba qué vendió.`);
  }
  const lineas = v.lineas.map(l => { const o = {tipo: l.tipo, cantidad: r2(l.cantidad), precio: +l.precio}; if (l.tipo === 'animal' && l.animalId) { o.animalId = l.animalId; const a = S.animales.get(l.animalId); o.desc = l.desc.trim() || (a ? `${CATS[a.cat].label} ${nameOf(a)}` : 'Animal'); } else if (l.desc.trim()) o.desc = l.desc.trim(); else if (l.tipo === 'animal') o.desc = 'Animal'; return o; });
  const total = lineas.reduce((s, l) => s + l.cantidad * l.precio, 0);
  let abonos = v.orig ? v.orig.abonos : [];
  if (!v.orig && v.pago === 'credito' && +v.abonoIni > 0) abonos = [{id: uid(), fecha: v.fecha, monto: Math.min(total, +v.abonoIni), forma: 'efectivo'}];
  if (v.pago !== 'credito') abonos = [];
  const venta = {id: v.id || uid(), fecha: v.fecha, cliente: v.cliente.trim(), lineas, pago: v.pago, abonos, notas: v.notas.trim(), creado: v.orig?.creado};
  const btn = document.querySelector('[data-act="vfsave"]'); if (btn) btn.disabled = true;
  const ok = await saveVenta(venta, v.orig?.fecha.slice(0, 7));
  if (!ok) { if (btn) btn.disabled = false; return; }
  if (venta.cliente && !clienteByName(venta.cliente)) await saveCliente({id: uid(), nombre: venta.cliente, telefono: '', notas: '', creado: new Date().toISOString()});
  if (!v.orig && v.baja) for (const l of lineas) if (l.animalId) {
    const a = S.animales.get(l.animalId); if (!a) continue;
    const nota = `Vendido el ${fmt(venta.fecha)}${venta.cliente ? ' a ' + venta.cliente : ''}.`;
    if (a.cat === 'lote') { const rest = (+a.cantidad || 0) - l.cantidad; await saveAnimal({...a, cantidad: Math.max(0, rest), activo: rest > 0, notas: [a.notas, `${l.cantidad} cab. ${nota}`].filter(Boolean).join('\n')}); }
    else await saveAnimal({...a, activo: false, notas: [a.notas, nota].filter(Boolean).join('\n')});
  }
  const isNew = !v.orig; closeForm(); VF = null;
  toast(isNew ? `Venta registrada · Factura N° ${facturaNumeros().get(venta.id) || ''}` : 'Venta actualizada');
  scheduleRender();
}

/* factura */
function facturaTexto(v, no){
  return [`FACTURA DE VENTA N° ${no}`, 'Kana Lux', `Fecha: ${fmt(v.fecha)}`, `Cliente: ${v.cliente || 'Cliente de contado'}`, '',
    ...v.lineas.map(l => `${l.tipo === 'animal' || l.tipo === 'otro' ? (l.desc || PROD[l.tipo].l) : PROD[l.tipo].l}: ${l.tipo === 'queso' ? nk(l.c) : n1(l.c)} ${PROD[l.tipo].u} x ${col(l.P)} = ${col(l.tot)}`),
    '', `TOTAL: ${col(v.total)}`, `Forma de pago: ${PAGOS[v.pago]}`, ...(v.pago === 'credito' ? [`Abonado: ${col(v.pagado)}`, `Saldo pendiente: ${col(v.saldo)}`] : []), ...(v.notas ? ['Notas: ' + v.notas] : [])].join('\n');
}
function openFactura(id){
  const v = ventaById(id); if (!v) return;
  const no = facturaNumeros().get(id);
  DLG = {fields: [], factura: true, id, texto: facturaTexto(v, no)};
  $('#dlg').innerHTML = `<div class="dlg-scrim" data-act="closedlg"><div class="dlg inv" role="dialog" aria-modal="true" aria-labelledby="inv-t">
    <div class="inv-head"><div><div class="eyebrow">Kana Lux · Registro de finca</div><h3 id="inv-t">Factura de venta</h3></div><div class="inv-no"><span class="lbl">N°</span><span class="num">${no}</span></div></div>
    <dl class="inv-meta three"><div><dt>Fecha</dt><dd>${fmt(v.fecha)}</dd></div><div><dt>Cliente</dt><dd>${esc(v.cliente || 'Cliente de contado')}</dd></div><div><dt>Forma de pago</dt><dd>${PAGOS[v.pago]}</dd></div></dl>
    <div class="tbl-wrap"><table class="inv-tbl"><thead><tr><th>Descripción</th><th class="r">Cantidad</th><th class="r">Precio unitario</th><th class="r">Total</th></tr></thead>
      <tbody>${v.lineas.map(l => `<tr><td>${esc(l.tipo === 'animal' || l.tipo === 'otro' ? (l.desc || PROD[l.tipo].l) : PROD[l.tipo].l)}</td><td class="r num">${l.tipo === 'queso' ? nk(l.c) : n1(l.c)} ${PROD[l.tipo].u}</td><td class="r num">${col(l.P)}</td><td class="r num">${col(l.tot)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total a pagar</td><td class="r num">${col(v.total)}</td></tr>
      ${v.pago === 'credito' ? `<tr class="sub-foot"><td colspan="3">Abonado</td><td class="r num">${col(v.pagado)}</td></tr><tr class="sub-foot"><td colspan="3">Saldo pendiente</td><td class="r num ${v.saldo > 0.5 ? 'down' : 'up'}">${v.saldo > 0.5 ? col(v.saldo) : 'Pagada'}</td></tr>` : ''}</tfoot></table></div>
    <div style="margin-top:10px">${estadoChip(v)}</div>
    ${v.pago === 'credito' && v.abonos.length ? `<h4 class="mini-h">Abonos</h4><div class="tbl-wrap"><table class="inv-tbl"><tbody>${v.abonos.map(a => `<tr><td class="num">${fmt(a.fecha)}</td><td>${PAGOS[a.forma] || 'Efectivo'}</td><td class="r num">${col(a.monto)}</td><td class="r"><button class="x" data-act="delabono" data-v="${esc(v.id)}" data-a="${esc(a.id)}" aria-label="Eliminar abono">✕</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    ${v.notas ? `<p class="inv-notes"><b>Notas:</b> ${esc(v.notas)}</p>` : ''}
    <div class="dlg-foot inv-foot"><div class="row-actions"><button type="button" class="btn ghost" data-act="facedit" data-v="${esc(v.id)}">Corregir</button>${v.saldo > 0.5 ? `<button type="button" class="btn" data-act="abonar" data-v="${esc(v.id)}">Registrar abono</button>` : ''}</div>
      <div class="r"><button type="button" class="btn" data-act="faccopy">Copiar</button><button type="button" class="btn" data-act="facpng" id="facpng" hidden>Descargar</button><button type="button" class="btn primary" data-act="closedlg">Cerrar</button></div></div>
  </div></div>`;
  downloadsNS().then(d => { const b = document.getElementById('facpng'); if (b && d) b.hidden = false; });
}
let _dl;
function downloadsNS(){ return Promise.resolve(window.NativeDL); }
function facturaPNG(v, no){
  const W = 820, lh = 34, rows = v.lineas.length + (v.pago === 'credito' ? 2 : 0);
  const H = 360 + v.lineas.length * lh + (v.pago === 'credito' ? 56 : 0) + (v.notas ? 40 : 0);
  const cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H * 2;
  const c = cv.getContext('2d'); c.scale(2, 2);
  const F = (w, s) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#0a0a0a'; c.fillRect(0, 0, W, 96);
  c.fillStyle = '#e8b923'; c.fillRect(0, 96, W, 5);
  c.fillStyle = '#e8b923'; c.font = F('700', 26); c.fillText('Kana Lux', 40, 50);
  c.fillStyle = '#bbbbbb'; c.font = F('400', 14); c.fillText('Registro de finca', 40, 74);
  c.textAlign = 'right'; c.fillStyle = '#ffffff'; c.font = F('700', 22); c.fillText('FACTURA DE VENTA', W - 40, 48);
  c.fillStyle = '#e8b923'; c.font = F('700', 20); c.fillText('N° ' + no, W - 40, 76); c.textAlign = 'left';
  let y = 140;
  const meta = [['Fecha', fmt(v.fecha)], ['Cliente', v.cliente || 'Cliente de contado'], ['Forma de pago', PAGOS[v.pago]]];
  meta.forEach(([k, val], i) => { const x = 40 + i * 260; c.fillStyle = '#777'; c.font = F('700', 11); c.fillText(k.toUpperCase(), x, y); c.fillStyle = '#111'; c.font = F('600', 16); c.fillText(val.length > 26 ? val.slice(0, 25) + '…' : val, x, y + 22); });
  y += 60;
  c.fillStyle = '#f3f1ea'; c.fillRect(40, y, W - 80, 34);
  c.fillStyle = '#555'; c.font = F('700', 12);
  c.fillText('DESCRIPCIÓN', 52, y + 22); c.textAlign = 'right'; c.fillText('CANTIDAD', 470, y + 22); c.fillText('PRECIO', 620, y + 22); c.fillText('TOTAL', W - 52, y + 22); c.textAlign = 'left';
  y += 34;
  c.font = F('400', 15);
  for (const l of v.lineas) {
    c.fillStyle = '#111'; const d = l.tipo === 'animal' || l.tipo === 'otro' ? (l.desc || PROD[l.tipo].l) : PROD[l.tipo].l;
    c.fillText(d.length > 34 ? d.slice(0, 33) + '…' : d, 52, y + 23);
    c.textAlign = 'right'; c.fillText(`${l.tipo === 'queso' ? nk(l.c) : n1(l.c)} ${PROD[l.tipo].u}`, 470, y + 23); c.fillText(col(l.P), 620, y + 23); c.fillText(col(l.tot), W - 52, y + 23); c.textAlign = 'left';
    c.strokeStyle = '#e3e0d8'; c.beginPath(); c.moveTo(40, y + lh); c.lineTo(W - 40, y + lh); c.stroke(); y += lh;
  }
  c.strokeStyle = '#111'; c.lineWidth = 2; c.beginPath(); c.moveTo(40, y + 6); c.lineTo(W - 40, y + 6); c.stroke(); c.lineWidth = 1;
  y += 40; c.font = F('700', 20); c.fillStyle = '#111'; c.fillText('Total a pagar', 52, y); c.textAlign = 'right'; c.fillStyle = '#9a6f12'; c.fillText(col(v.total), W - 52, y); c.textAlign = 'left';
  if (v.pago === 'credito') { c.font = F('400', 15); c.fillStyle = '#444'; y += 30; c.fillText('Abonado', 52, y); c.textAlign = 'right'; c.fillText(col(v.pagado), W - 52, y); c.textAlign = 'left'; y += 26; c.fillText('Saldo pendiente', 52, y); c.textAlign = 'right'; c.fillStyle = v.saldo > 0.5 ? '#c0392b' : '#2f9e44'; c.fillText(v.saldo > 0.5 ? col(v.saldo) : 'Pagada', W - 52, y); c.textAlign = 'left'; }
  if (v.notas) { y += 40; c.fillStyle = '#555'; c.font = F('400', 14); c.fillText('Notas: ' + (v.notas.length > 90 ? v.notas.slice(0, 89) + '…' : v.notas), 52, y); }
  c.fillStyle = '#999'; c.font = F('400', 12); c.fillText('Gracias por su compra.', 40, H - 28);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

/* abonos */
function abonoForm(ventaId, cliente){
  let pend = allVentas().filter(v => v.saldo > 0.5 && (!cliente || normName(v.cliente) === normName(cliente))).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (ventaId) pend = pend.filter(v => v.id === ventaId).concat(pend.filter(v => v.id !== ventaId));
  if (!pend.length) { toast('No hay facturas pendientes.'); return; }
  const nums = facturaNumeros(), first = pend[0];
  openForm({
    title: 'Registrar abono', intro: esc(cliente ? `Cliente: ${cliente} · debe ${col(pend.reduce((s, v) => s + v.saldo, 0))}` : `Cliente: ${first.cliente || '—'}`),
    fields: [
      {id:'venta', label:'Factura', type:'select', required:true, value: first.id, options: pend.map(v => [v.id, `N° ${nums.get(v.id)} · ${fmtS(v.fecha)} · saldo ${col(v.saldo)}`])},
      {row:[{id:'fecha', label:'Fecha del pago', type:'date', required:true, value: today(), max: today()}, {id:'monto', label:'Monto (₡)', type:'number', required:true, value: Math.round(first.saldo)}]},
      {id:'forma', label:'Forma de pago', type:'select', required:true, value:'efectivo', options: PAGOS_COBRO}
    ],
    onChange: vals => { const v = pend.find(x => x.id === vals.venta); const e = $('#dlgerr'); if (e && v) { e.style.color = 'var(--ink-2)'; e.textContent = +vals.monto > 0 ? `Saldo después del abono: ${col(Math.max(0, v.saldo - (+vals.monto || 0)))}` : ''; } },
    validate: vals => { $('#dlgerr').style.color = ''; const v = pend.find(x => x.id === vals.venta); return !(+vals.monto > 0) ? 'Escriba el monto.' : v && +vals.monto > v.saldo + 0.5 ? `El abono es mayor que el saldo (${col(v.saldo)}).` : null; },
    toast: 'Abono registrado',
    onSubmit: vals => { const v = pend.find(x => x.id === vals.venta); return saveVenta({...v, abonos: [...v.abonos, {id: uid(), fecha: vals.fecha, monto: +vals.monto, forma: vals.forma}]}); }
  });
  $('#dlgform').addEventListener('input', () => DLG?.onChange?.(formVals()));
}

  openForm({
    title: isNew ? 'Registrar gasto' : 'Corregir gasto',
    fields: [
      {row:[{id:'fecha', label:'Fecha', type:'date', required:true, value: g?.fecha || today(), max: today()}, {id:'categoria', label:'Categoría', type:'select', required:true, value: g?.categoria || 'alimento', options: GASTO_CATS}]},
      {id:'desc', label:'Descripción', value: g?.desc, placeholder:'Ej. 10 sacos de concentrado'},
      {row:[{id:'monto', label:'Monto (₡)', type:'number', required:true, value: g?.monto}, {id:'pago', label:'Forma de pago', type:'select', required:true, value: g?.pago || 'efectivo', options: [...PAGOS_COBRO, ['credito','Crédito']]}]},
      {id:'notas', label:'Notas', type:'textarea', value: g?.notas}

/* clientes */
function clienteForm(c){
  const isNew = !c;
  openForm({
    title: isNew ? 'Nuevo cliente' : 'Editar cliente',
    fields: [
      {row:[{id:'nombre', label:'Nombre', required:true, value: c?.nombre}, {id:'telefono', label:'Teléfono', value: c?.telefono}]},
      {row:[{id:'precioQueso', label:'Precio especial queso (₡/kg)', type:'number', value: c?.precioQueso, hint:'Vacío = precio normal'}, {id:'precioLeche', label:'Precio especial leche (₡/L)', type:'number', value: c?.precioLeche}]},
      {id:'notas', label:'Notas', type:'textarea', value: c?.notas}
    ],
    validate: vals => { const d = clienteByName(vals.nombre); return d && d.id !== c?.id ? 'Ya existe un cliente con ese nombre.' : null; },
    toast: isNew ? 'Cliente agregado' : 'Cliente actualizado',
    onSubmit: async vals => {
      const nc = {id: c?.id || uid(), nombre: vals.nombre.trim(), telefono: vals.telefono || '', notas: vals.notas || '', creado: c?.creado || new Date().toISOString()};
      if (+vals.precioQueso > 0) nc.precioQueso = +vals.precioQueso; if (+vals.precioLeche > 0) nc.precioLeche = +vals.precioLeche;
      const ok = await saveCliente(nc);
      if (ok && c && normName(c.nombre) !== normName(nc.nombre)) { // renombrar en sus ventas
        for (const ym of [...S.ventas.keys()]) { const items = monthRaw(S.ventas, ym); if (items.some(x => normName(x.cliente) === normName(c.nombre))) await saveMonth('ventas', S.ventas, ym, items.map(x => normName(x.cliente) === normName(c.nombre) ? {...x, cliente: nc.nombre} : x)); }
      }
      return ok;
    },
    onDelete: isNew ? null : () => confirmDelete(`¿Eliminar a ${c.nombre} de la lista de clientes? Sus facturas se conservan.`, () => deleteCliente(c.id))
  });
}

function vVacas(){
  const vacas = filterQ(vacasOrden());
  return `<section class="section">
    <div class="sec-head"><h2>${animals('vaca').length} vacas de ordeño</h2><button class="btn primary" data-act="new" data-v="vaca">+ Vaca</button></div>
    <div class="tools"><input class="search" id="q" type="search" placeholder="Buscar por arete o nombre" value="${esc(S.q)}"></div>
    ${vacas.length ? `<div class="card tbl-wrap"><table><thead><tr><th>Vaca</th><th class="r">Último</th><th class="r">Prom. 7 d (por día)</th><th class="r">Prom. 30 d (por día)</th><th class="r">vs semana ant.</th><th>Preñez</th><th>Vacunas</th></tr></thead><tbody>
    ${vacas.map(v => { const s = cowStats(v.id), w = worst(v); const tr = s.p7 != null && s.prev7 ? (s.p7 - s.prev7) / s.prev7 * 100 : null;
      return `<tr class="click" data-act="open" data-id="${v.id}"><td><b>${esc(v.arete || '')}</b> ${esc(v.nombre || '')}${ubreEstado(v) ? `<div>${ubreChip(v)}</div>` : ''}</td><td class="r num">${s.last ? lk(s.last.y) : '—'}${s.last ? `<div class="sub">${fmtS(s.last.x)}</div>` : ''}</td><td class="r num">${lk(s.p7)}</td><td class="r num">${lk(s.p30)}</td><td class="r num ${tr == null ? '' : tr >= 0 ? 'up' : 'down'}">${tr == null ? '—' : (tr >= 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(tr)) + '%'}</td><td>${(e => e.k === 'vacia' ? '<span class="sub">Vacía</span>' : e.k === 'lactando' ? `<span class="sub">${esc(e.txt.split(' · ')[0])}</span>` : chip(e.k === 'prenada' ? 'aldia' : 'pendiente', e.txt.split(' · ').slice(0, 2).join(' · ').replace('Servida, por confirmar', 'Por confirmar')))(vacaEstado(v))}</td><td>${w ? chip(w.state) : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card empty"><strong>${S.q ? 'Sin resultados' : 'Aún no hay vacas'}</strong>${S.q ? '' : 'Agregue sus vacas de ordeño con su arete y fecha de registro.'}</div>`}
  </section>`;
}

function vCerdos(seg){
  let body = '';
  if (seg === 'cerdas') {
    const list = filterQ(animals('cerda')).sort((a, b) => (a.arete || '').localeCompare(b.arete || '', 'es', {numeric:true}));
    body = `<div class="card list">${list.length ? list.map(c => {
      const g = gestacion(c), l = lactancia(c), w = worst(c), ra = reproAlerts(c)[0];
      let est = 'Vacía / sin servicio';
      if (g) { const pe = addDays(g.fecha, GESTACION); est = `Gestante · día ${diff(g.fecha, today())} · parto ${fmtS(pe)}`; }
      else if (l) est = `Lactando · parió ${fmtS(l.parto.fecha)} (${l.parto.vivos ?? '?'} vivos)`;
      const top = ra && (!w || ST_RANK[ra.state] <= ST_RANK[w.state]) ? chip(ra.state, `${ra.text} ${fmtS(ra.due)}`) : w ? chip(w.state, w.state === 'aldia' ? 'Al día' : w.state === 'sinregistro' ? w.v.nombre.split(' ·')[0] : `${fmtS(w.due)} · ${w.v.nombre.split(' ·')[0]}`) : '';
      const cs = cerdaStats(c);
      return `<button class="item" data-act="open" data-id="${c.id}">${c.arete ? `<span class="tag num">${esc(c.arete)}</span>` : ''}<div class="main"><div class="t">${esc(c.nombre || 'Cerda ' + (c.arete || ''))}</div><div class="d">${est} · ${cs.partos} partos${cs.nv != null ? ` · ${n1(cs.nv)} vivos prom.` : ''}</div></div><div class="side">${top}${retiroChip(c)}${cs.revisar.length ? '<span class="chip st-proxima">Revisar rendimiento</span>' : ''}</div></button>`;
    }).join('') : `<div class="empty"><strong>Aún no hay cerdas</strong>Registre sus reproductoras para llevar montas, partos, destetes y vacunas.</div>`}</div>`;
  } else {
    const list = filterQ(animals('lote')).sort((a, b) => (b.nacimiento || '').localeCompare(a.nacimiento || ''));
    body = `<div class="card list">${list.length ? list.map(l => {
      const w = worst(l), p = lastPeso(l), g = gdp(l.pesos);
      return `<button class="item" data-act="open" data-id="${l.id}"><span class="tag num">${+l.cantidad || 0}</span><div class="main"><div class="t">${esc(l.nombre || 'Lote')}</div><div class="d">${edad(l.nacimiento)}${p ? ` · ${n1(p.kg)} kg prom. (${fmtS(p.fecha)})` : ' · sin pesajes'}${g != null ? ` · GDP ${Math.round(g)} g/día` : ''}</div></div><div class="side">${w ? chip(w.state, w.state === 'aldia' ? 'Al día' : `${w.due ? fmtS(w.due) + ' · ' : ''}${w.v.nombre.split(' (')[0]}`) : ''}</div></button>`;
    }).join('') : `<div class="empty"><strong>Aún no hay lotes</strong>Un lote es una camada o grupo de engorde. Se crean solos al registrar un parto, o agréguelos a mano.</div>`}</div>`;
  }
  const n = seg === 'cerdas' ? `${animals('cerda').length} cerdas` : `${animals('lote').length} lotes`;
  return `<section class="section">
    <div class="sec-head"><h2>${n}</h2><button class="btn primary" data-act="new" data-v="${seg === 'cerdas' ? 'cerda' : 'lote'}">+ ${seg === 'cerdas' ? 'Cerda' : 'Lote'}</button></div>
    <div class="tools"><input class="search" id="q" type="search" placeholder="Buscar" value="${esc(S.q)}"></div>
    ${body}
  </section>`;
}

const diasTxt = d => { d = +d; if (d >= 60 && d % 30 === 0) return `${d / 30} meses`; if (d === 30) return '1 mes'; return `${d} días`; };

    <div style="margin-top:10px"><button class="btn small" data-act="planreset" data-area="${area}">${items.length ? 'Restaurar esquema base' : 'Cargar esquema base'}</button></div></div>

}

/* ---------- cerdos: verracos, mortalidad, alimento, tratamientos, movimientos, calendario, indicadores ---------- */
const TRAT_TIPOS = [['desparasitante','Desparasitante'],['antibiotico','Antibiótico'],['vitamina','Vitaminas / hierro'],['otro','Otro tratamiento']];
const TRAT_L = Object.fromEntries(TRAT_TIPOS);
const MUERTE_CAUSAS = [['aplastado','Aplastado por la madre'],['diarrea','Diarrea'],['debil','Débil o bajo peso'],['respiratorio','Problema respiratorio'],['otra','Otra causa']];
const MUERTE_L = Object.fromEntries(MUERTE_CAUSAS);
const PESO_VENTA = 100;
const porcinos = () => [...animals('cerda'), ...animals('verraco'), ...animals('lote')];
const sumBy = (arr, f) => (arr || []).reduce((s, x) => s + (+f(x) || 0), 0);
const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
const pct = v => v == null || isNaN(v) ? '—' : (Math.round(v * 1000) / 10).toLocaleString('es-CR') + ' %';
function retiroHasta(a){ let max = ''; for (const t of a.tratamientos || []) if (+t.retiroDias > 0) { const f = addDays(t.fecha, +t.retiroDias); if (f > max) max = f; } return max && max >= today() ? max : ''; }
const retiroChip = a => { const r = retiroHasta(a); return r ? `<span class="chip st-atrasada">💊 En retiro hasta ${fmtS(r)}</span>` : ''; };
const muertesTot = a => sumBy(a.muertes, m => m.cantidad);
const vendidasDeLote = id => allVentas().reduce((s, v) => s + v.lineas.filter(l => l.animalId === id).reduce((x, l) => x + l.c, 0), 0);
const loteInicial = a => +a.inicial || ((+a.cantidad || 0) + muertesTot(a) + vendidasDeLote(a.id));
function engorde(a){
  const p = (a.pesos || []).slice().sort(byFecha), first = p[0], last = p[p.length - 1];
  const span = p.length > 1 ? diff(first.fecha, last.fecha) : 0;
  const gAll = span > 0 ? (last.kg - first.kg) / span * 1000 : null;
  const g = gdp(a.pesos) ?? gAll;
  const cab = +a.cantidad || 0, alimKg = sumBy(a.alimento, x => x.kg), alimCosto = sumBy(a.alimento, x => x.costo);
  const kgGan = span > 0 ? (last.kg - first.kg) * cab : null;
  const conv = kgGan > 0 && alimKg > 0 ? alimKg / kgGan : null, costoKg = kgGan > 0 && alimCosto > 0 ? alimCosto / kgGan : null;
  const meta = +a.pesoVenta || PESO_VENTA;
  let fechaVenta = null, listo = false;
  if (last) { if (last.kg >= meta) { listo = true; fechaVenta = last.fecha; } else if (g > 0) fechaVenta = addDays(last.fecha, Math.ceil((meta - last.kg) / (g / 1000))); }
  const pesoHoy = last ? (g > 0 ? last.kg + g / 1000 * Math.max(0, diff(last.fecha, today())) : last.kg) : null;
  const muertes = muertesTot(a), inicial = loteInicial(a);
  return {p, first, last, gdp: g, cab, alimKg, alimCosto, kgGan, conv, costoKg, meta, fechaVenta, listo: listo || (pesoHoy != null && pesoHoy >= meta), pesoHoy, muertes, inicial, mort: inicial ? muertes / inicial : null};
}
function cerdaStats(c){
  const sv = (c.servicios || []).slice().sort(byFecha), partos = sv.filter(s => s.parto), dest = partos.filter(s => s.destete);
  const ids = []; let lastDest = null;
  for (const s of sv) { if (lastDest && s.fecha >= lastDest) { const d = diff(lastDest, s.fecha); if (d >= 0 && d < 150) ids.push(d); lastDest = null; } if (s.destete) lastDest = s.destete.fecha; }
  const vivosDest = sumBy(dest, s => s.parto.vivos);
  const cerr = sv.filter(s => s.parto || s.vacia).length;
  const st = {partos: partos.length, vacias: sv.filter(s => s.vacia).length, nt: avg(partos.map(s => +s.parto.total || 0)), nv: avg(partos.map(s => +s.parto.vivos || 0)), nd: avg(dest.map(s => +s.destete.cantidad || 0)),
    mortLact: vivosDest ? 1 - sumBy(dest, s => s.destete.cantidad) / vivosDest : null, ide: avg(ids), partos12: partos.filter(s => s.parto.fecha >= addDays(today(), -365)).length,
    paricion: cerr ? partos.length / cerr : null, ultimoParto: partos.length ? partos[partos.length - 1].parto.fecha : null};
  const why = [];
  if (st.partos >= 2 && st.nv != null && st.nv < 9) why.push('pocos nacidos vivos');
  if (st.partos >= 2 && st.nd != null && st.nd < 8) why.push('pocos destetados');
  if (st.vacias >= 2) why.push(`${st.vacias} repeticiones`);
  st.revisar = why; return st;
}
function verracoStats(vr){
  const svs = animals('cerda').concat([...S.animales.values()].filter(a => a.cat === 'cerda' && a.activo === false)).flatMap(c => (c.servicios || []).filter(s => s.verracoId === vr.id || (!s.verracoId && s.verraco && normName(s.verraco) === normName(vr.nombre || vr.arete))).map(s => ({...s, cerda: c})));
  const partos = svs.filter(s => s.parto);
  return {svs, n: svs.length, partos: partos.length, nv: avg(partos.map(s => +s.parto.vivos || 0)), fert: svs.filter(s => s.parto || s.vacia).length ? partos.length / svs.filter(s => s.parto || s.vacia).length : null};
}

/* eventos para calendario y avisos */
function eventosCerdos(from, to){
  const ev = [], inR = f => f && f >= from && f <= to, add = (fecha, ico, txt, a, cls) => { if (inR(fecha)) ev.push({fecha, ico, txt, id: a.id, cls}); };
  for (const c of animals('cerda')) {
    const g = gestacion(c), l = lactancia(c), n = nameOf(c);
    if (g) { add(addDays(g.fecha, 21), '🔎', `Revisar celo · ${n}`, c, 'ev-celo'); add(addDays(g.fecha, GESTACION), '🐖', `Parto esperado · ${n}`, c, 'ev-parto'); }
    if (l) add(addDays(l.parto.fecha, DESTETE), '🍼', `Destete · ${n}`, c, 'ev-destete');
  }
  for (const a of porcinos()) {
    for (const s of schedule(a)) if (s.due && s.state !== 'aldia' && s.state !== 'fuera') add(s.due, '💉', `${s.v.nombre.split(' (')[0]} · ${nameOf(a)}`, a, 'ev-vac');
    const r = retiroHasta(a); if (r) add(r, '💊', `Termina retiro · ${nameOf(a)}`, a, 'ev-retiro');
    if (a.cat === 'lote') { const e = engorde(a); if (e.fechaVenta && !e.listo) add(e.fechaVenta, '⚖️', `Listo para venta · ${nameOf(a)}`, a, 'ev-venta'); }
  }
  return ev.sort((x, y) => x.fecha.localeCompare(y.fecha));
}

function vCalendario(){

function vIndicadores(){

    </div></section>
  ${animals('verraco').length ? `<section class="section">${dc('Verracos', '', `<div class="tbl-wrap"><table class="ltbl"><thead><tr><th>Verraco</th><th class="r">Servicios</th><th class="r">Partos</th><th class="r">Fertilidad</th><th class="r">Prom. nacidos vivos</th></tr></thead><tbody>

/* ---------- ficha: bloques nuevos ---------- */

  return `<div class="card">
    <div class="block-h"><h3>Engorde y venta</h3><button class="btn small" data-act="meta" data-id="${a.id}">Peso de venta: ${n1(e.meta)} kg</button></div>
    <dl class="facts" style="margin:0"><div><dt>Peso estimado hoy</dt><dd class="num">${e.pesoHoy != null ? n1(e.pesoHoy) + ' kg' : '—'}</dd></div><div><dt>Ganancia diaria</dt><dd class="num">${e.gdp != null ? Math.round(e.gdp) + ' g/día' : '—'}</dd></div>
      <div><dt>Venta estimada</dt><dd>${e.listo ? '✅ Listo para vender' : e.fechaVenta ? fmt(e.fechaVenta) : 'Faltan 2 pesajes'}</dd></div><div><dt>Cabezas</dt><dd class="num">${e.cab} de ${e.inicial}</dd></div></dl>
  </div>
  <div class="card">
    <div class="block-h"><h3>Mortalidad</h3><button class="btn small" data-act="muerte" data-id="${a.id}">+ Registrar muerte</button></div>
    <div class="note" style="border-top:0">${e.muertes ? `<b>${e.muertes}</b> muertes de ${e.inicial} cerdos · <b class="${e.mort > 0.1 ? 'down' : ''}">${pct(e.mort)}</b>` : 'Sin muertes registradas.'}</div>
    ${muertes.length ? `<div class="tbl-wrap"><table class="hist"><tbody>${muertes.map(m => `<tr><td class="num">${fmt(m.fecha)}</td><td class="r num">${m.cantidad}</td><td>${esc(MUERTE_L[m.causa] || 'Otra causa')}${m.nota ? ` <span class="sub">· ${esc(m.nota)}</span>` : ''}</td><td class="r"><button class="x" data-act="delmuerte" data-id="${a.id}" data-v="${m.id}" aria-label="Eliminar">✕</button></td></tr>`).join('')}</tbody></table></div>` : ''}
  </div>
  <div class="card">
    <div class="block-h"><h3>Alimento</h3><button class="btn small" data-act="alimento" data-id="${a.id}">+ Registrar alimento</button></div>
    <dl class="facts" style="margin:0"><div><dt>Alimento dado</dt><dd class="num">${n1(e.alimKg)} kg</dd></div><div><dt>Costo</dt><dd class="num">${col(e.alimCosto)}</dd></div><div><dt>Conversión</dt><dd class="num">${e.conv != null ? n2(e.conv) + ' kg/kg' : '—'}</dd></div><div><dt>Costo por kg ganado</dt><dd class="num">${e.costoKg != null ? col(e.costoKg) : '—'}</dd></div></dl>
    ${alim.length ? `<div class="tbl-wrap" style="border-top:1px solid var(--line)"><table class="hist"><tbody>${alim.map(x => `<tr><td class="num">${fmt(x.fecha)}</td><td>${esc(x.tipo || 'Alimento')}</td><td class="r num">${n1(x.kg)} kg</td><td class="r num">${x.costo ? col(x.costo) : '—'}</td><td class="r"><button class="x" data-act="delalim" data-id="${a.id}" data-v="${x.id}" aria-label="Eliminar">✕</button></td></tr>`).join('')}</tbody></table></div>` : ''}

  </div>
  <div class="card">
    <div class="block-h"><h3>Movimientos</h3><button class="btn small" data-act="dividir" data-id="${a.id}" ${e.cab < 2 ? 'disabled' : ''}>Dividir lote</button></div>
    ${movs.length ? `<div class="tbl-wrap"><table class="hist"><tbody>${movs.map(x => `<tr><td class="num">${fmt(x.fecha)}</td><td>${esc(x.detalle)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="note" style="border-top:0">Sin movimientos. Aquí quedan las compras, divisiones y uniones de lotes.</div>'}

}
function sheetTrat(a){

    <div class="block-h"><h3>Tratamientos</h3><button class="btn small" data-act="trat" data-id="${a.id}">+ Tratamiento</button></div>

function sheetVerraco(a){
  const s = verracoStats(a);
  return `<div class="card"><div class="block-h"><h3>Servicios realizados</h3><span class="sub">${s.n} servicios · ${s.partos} partos · fertilidad ${pct(s.fert)}</span></div>

/* ---------- sheet (ficha) ---------- */
function renderSheet(){
  const el = $('#sheet');
  const a = S.sheet && S.animales.get(S.sheet);
  if (!a) { if (el.innerHTML) { el.innerHTML = ''; document.body.style.overflow = ''; } S.sheet = null; return; }
  const scroll = el.querySelector('.sheet')?.scrollTop || 0;
  document.body.style.overflow = 'hidden';
  el.innerHTML = `<div class="scrim" data-act="closesheet"><aside class="sheet" role="dialog" aria-modal="true" aria-label="Ficha">
    <div class="sheet-head"><div><h2>${a.cat !== 'lote' && a.arete ? `<span class="tag num">${esc(a.arete)}</span>` : ''}${esc(a.cat === 'lote' ? a.nombre || 'Lote' : a.nombre || CATS[a.cat].label)}</h2><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${spTag(a)}${a.activo === false ? chip('fuera', 'De baja') : ''}</div></div>
      <div class="row-actions"><button class="btn small" data-act="edit" data-id="${a.id}">Editar</button><button class="btn small ghost" data-act="closesheet" aria-label="Cerrar">✕</button></div></div>
    ${sheetFacts(a)}
    ${a.cat === 'cerda' ? sheetRepro(a) : ''}
    ${a.cat === 'vaca' ? sheetReproVaca(a) + sheetUbreVaca(a) + sheetMilk(a) : ''}
    ${a.cat === 'verraco' ? sheetVerraco(a) : ''}
    ${a.cat === 'lote' ? sheetLote(a) : ''}
    ${sheetVac(a)}
    ${a.cat !== 'vaca' ? sheetPesos(a) : ''}
    ${CATS[a.cat].esp === 'porcino' ? sheetTrat(a) : ''}
    ${a.notas ? `<div class="card pad"><div class="sub" style="font-weight:700">Notas</div>${esc(a.notas)}</div>` : ''}
  </aside></div>`;
  el.querySelector('.sheet').scrollTop = scroll;
  drawCharts(el);
}
function sheetFacts(a){
  const f = [];
  if (a.cat === 'lote') { f.push(['Cabezas', +a.cantidad || 0], ['Origen', a.origen === 'compra' ? 'Comprados' : 'Nacidos en la finca'], ['Nacimiento', fmt(a.nacimiento)], ['Edad', edad(a.nacimiento)]); if (a.madre) f.push(['Madre', a.madre]); }
  else {
    f.push(['Nacimiento', fmt(a.nacimiento)], ['Edad', edad(a.nacimiento)]);
    if (a.cat === 'ternero') f.push(['Sexo', a.sexo === 'hembra' ? 'Hembra' : a.sexo === 'macho' ? 'Macho' : '—']);
    if (a.raza) f.push(['Raza', a.raza]);
    if (a.madre) f.push(['Madre', a.madre]);
  }
  if (inicio(a)) f.push(['Registro', fmt(inicio(a))]);
  const p = lastPeso(a);
  if (p && a.cat !== 'vaca') f.push([a.cat === 'lote' ? 'Peso prom.' : 'Último peso', n1(p.kg) + ' kg']);
  const extra = a.cat === 'ternero' && a.sexo === 'hembra' ? `<div class="note">¿Ya entró a producción? <button class="btn small" data-act="promote" data-id="${a.id}">Pasar a vacas de ordeño</button></div>` : '';
  return `<div class="card"><dl class="facts" style="margin:0">${f.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>${extra}</div>`;
}
function sheetVac(a){
  const sc = schedule(a);
  const apps = (a.vacunas || []).slice().sort(byFecha).reverse();

/* ---------- mastitis y control de ubre ---------- */
const UBRE_MOTIVOS = [['mastitis', 'Mastitis clínica (ubre caliente, hinchada o leche con grumos)'], ['subclinica', 'Mastitis subclínica (prueba CMT positiva)'], ['lesion', 'Herida o lesión de la ubre o pezón'], ['cuarto', 'Cuarto dañado o ciego'], ['otra', 'Otra razón médica']];
const UBRE_MOT_TXT = {mastitis: 'Mastitis clínica', subclinica: 'Mastitis subclínica', lesion: 'Lesión de ubre', cuarto: 'Cuarto dañado', otra: 'Otra razón médica'};
const UBRE_CUARTOS = [['DI', 'Delantero izquierdo'], ['DD', 'Delantero derecho'], ['TI', 'Trasero izquierdo'], ['TD', 'Trasero derecho']];
const UBRE_CUA_TXT = {DI: 'del. izq.', DD: 'del. der.', TI: 'tras. izq.', TD: 'tras. der.'};
const UBRE_RECUP_DIAS = 14;
const ubreEps = a => (a.ubre || []).slice().sort((x, y) => (y.ini || '').localeCompare(x.ini || ''));
function ubreEstado(a){
  const eps = ubreEps(a), act = eps.find(e => !e.fin);
  if (act) return {k: 'fuera', ep: act, txt: act.apartada === false ? `En tratamiento desde ${fmtS(act.ini)} · leche no apta` : `Fuera de ordeño desde ${fmtS(act.ini)}`, chip: act.apartada === false ? '💉 En tratamiento' : '🚫 Fuera de ordeño', st: 'atrasada'};
  const cerr = eps.filter(e => e.fin);
  for (const e of cerr) { if (+e.retiroDias > 0) { const h = addDays(e.fin, +e.retiroDias); if (h >= today()) return {k: 'retiro', ep: e, hasta: h, txt: `Leche en retiro hasta ${fmtS(h)}`, chip: `💊 Retiro hasta ${fmtS(h)}`, st: 'proxima'}; } }
  const u = cerr[0];
  if (u && diff(u.fin, today()) <= UBRE_RECUP_DIAS) return {k: 'recup', ep: u, txt: `Recuperándose · alta ${fmtS(u.fin)}`, chip: '🩺 Recuperándose', st: 'pendiente'};
  return null;
}
const ubreChip = a => { const u = ubreEstado(a); return u ? `<span class="chip st-${u.st}">${esc(u.chip)}</span>` : ''; };
function ubreAlerts(a){
  const out = [], u = ubreEstado(a);
  if (!u) return out;
  if (u.k === 'fuera' && diff(u.ep.ini, today()) >= 7) out.push({a, kind: 'ubre', state: 'proxima', due: u.ep.ini, text: 'Fuera de ordeño hace ' + diff(u.ep.ini, today()) + ' días: revisar y dar de alta'});
  if (u.k === 'retiro' && diff(today(), u.hasta) <= 1) out.push({a, kind: 'ubre', state: 'proxima', due: u.hasta, text: 'Termina el retiro de la leche'});
  return out;
}
function ubreCasos(meses){
  const desde = addDays(today(), -Math.round(meses * 30.4)), out = [];
  for (const a of animals('vaca')) for (const e of a.ubre || []) if ((e.ini || '') >= desde) out.push({a, e});
  return out;
}
function sheetUbreVaca(a){

  const st = u ? `<b>${esc(u.txt)}</b>${u.ep && u.k === 'fuera' ? `<br><span class="sub">${esc(UBRE_MOT_TXT[u.ep.motivo] || 'Ubre')}${(u.ep.cuartos || []).length ? ' · ' + u.ep.cuartos.map(c => UBRE_CUA_TXT[c]).join(', ') : ''}. Mientras esté así, no cuenta como baja de rendimiento.</span>` : ''}` : '<span class="sub">Sin problemas de ubre activos.</span>';

      ${eps.map(e => `<tr><td class="num">${fmt(e.ini)}</td><td>${esc(UBRE_MOT_TXT[e.motivo] || 'Ubre')}${(e.cuartos || []).length ? `<div class="sub">${e.cuartos.map(c => UBRE_CUA_TXT[c]).join(', ')}</div>` : ''}${e.trat ? `<div class="sub">${esc(e.trat)}</div>` : ''}</td><td class="num">${e.fin ? fmt(e.fin) : '<span class="sub">En curso</span>'}${+e.retiroDias > 0 && e.fin ? `<div class="sub">retiro ${+e.retiroDias} d</div>` : ''}</td><td class="r"><button class="btn small ghost" data-act="delubre" data-id="${a.id}" data-v="${e.id}" aria-label="Eliminar">✕</button></td></tr>`).join('')}
    </tbody></table></div>` : ''}

}
function vUbre(){

    <div class="note" style="margin-top:8px">Las vacas fuera de ordeño no se cuentan como “bajando” en Producción por vaca, y los 14 días después del alta aparecen como “Recuperándose”.</div>

    </tbody></table></div></div>` : '<div class="card empty">Todavía no hay casos registrados.</div>'}
